schema_version: "1.0"
status: BLOCKED_ON_REAL_K0
round: R1_LEGACY_VS_LEAN
provider_target: dola
model_target: seedance-2.5

purpose: >
  Register the three real K0 inputs required for the first Legacy-vs-Lean
  comparison. The benchmark must not start from recreated or inferred images.

execution_rule:
  all_inputs_required: true
  same_k0_for_both_variants: true
  asset_identity_required:
    - asset_id
    - sha256
    - bytes
    - provenance_kind
    - locator_kind
    - locator_value
  authority: "actual K0 bytes > old prompt > old director prose"
  block_when_missing: BENCHMARK_INPUT_BLOCKED

historical_design_evidence:
  source_project: "06_TESTS/MV/WEB_R3/30D_60/D01-B"
  director_plan: "DIRECTOR_PLAN_v2.md"
  video_qa: "VIDEO_SET_QA_v1.md"
  note: >
    Historical text and QA may define the test task, but they do not substitute
    for the original accepted K0 image bytes.

inputs:
  A_FACE_HAND:
    asset_id: null
    sha256: null
    bytes: null
    locator_kind: null
    locator_value: null
    provenance_kind: null
    status: MISSING
    task_origin: >
      New benchmark K0 required. Use an identity-sensitive fictional-character
      composition where one hand is already close to the face or lower-face
      region at frame 0 so hand/face interaction is physically testable.
    required_properties:
      - single adult fictional character
      - face and both relevant hands clearly readable
      - no second human character
      - hand-face distance small enough to stress interaction continuity
      - enough negative space for one controlled camera relationship

  B_MOVING_CAMERA:
    asset_id: null
    sha256: null
    bytes: null
    locator_kind: null
    locator_value: null
    provenance_kind: null
    status: MISSING
    task_origin: >
      Reuse the moving-character director grammar already documented in the
      project, but bind it to a new real K0. The frame must show a character
      already in a readable walking phase rather than standing before motion.
    required_properties:
      - single adult fictional character
      - full or three-quarter body readable
      - one foot already transferring weight at frame 0
      - clear forward travel direction
      - enough depth for FOLLOW/YIELD/OVERTAKE comparison
      - background geometry useful for judging real camera translation

  C_PHYSICS:
    asset_id: null
    sha256: null
    bytes: null
    locator_kind: null
    locator_value: null
    provenance_kind: null
    status: MISSING
    task_origin: >
      Derived from D01-B S02/S03 evidence: one visible causal physical event,
      with the subject and camera otherwise kept comparatively simple.
    required_properties:
      - one dominant physical interaction already staged at frame 0
      - water OR cloth/contact OR fragile-object interaction
      - stable readable subject identity if a character is present
      - one obvious direction of force or causal chain
      - no competing second major event

ready_condition: >
  Change status to READY only after all three K0 assets are registered with
  durable identity metadata and the exact same assets are bound to both prompt
  variants in every R1 comparison cell.
