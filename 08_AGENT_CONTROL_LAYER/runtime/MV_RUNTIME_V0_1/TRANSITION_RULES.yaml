runtime_id: "MV_RUNTIME_V0_1"
version: "0.2"

allowed_stage_lifecycle:
  - "NOT_STARTED -> DESIGNING"
  - "DESIGNING -> READY_FOR_TEST"
  - "READY_FOR_TEST -> TESTING"
  - "TESTING -> DELIVERED"
  - "DELIVERED -> REVIEW"
  - "REVIEW -> SEALED"
  - "REVIEW -> REVISE"
  - "REVISE -> DESIGNING"
  - "SEALED -> DIRTY"
  - "* -> BLOCKED"
  - "BLOCKED -> DESIGNING"

seal_requirements:
  deterministic:
    - "all required input contract fields exist"
    - "all required artifact refs exist"
    - "all required evidence refs exist"
    - "no blocking issue remains"
  semantic:
    - "Judge result satisfies stage seal policy"
  human:
    - "required human gate is PASS"

judge_policy:
  production:
    preferred: "FRESH_STATELESS_JUDGE"
    same_context_allowed: false
  test:
    same_model_minimal_context_allowed: true
    required_marker: "TEST_ONLY_SAME_MODEL_MINIMAL_CONTEXT"
    interpretation: "protocol validation only; not independence validation"

human_gate_policy:
  production:
    auto_confirm_allowed: false
  test:
    auto_confirm_allowed: true
    required_marker: "AUTO_CONFIRMED_FOR_TEST"

next_stage_activation:
  rule: "Downstream may enter DESIGNING only when all dependencies are SEALED at compatible contract versions."

prohibited_transitions:
  - "NOT_STARTED -> SEALED"
  - "DESIGNING -> SEALED"
  - "TESTING -> SEALED"
  - "REVISE -> SEALED"
  - "BLOCKED -> SEALED"

no_evidence_no_transition: true

reopen_policy:
  requires: ["reason", "new stage version", "dependency impact check"]
  downstream_effect:
    contract_compatible_internal_change: "NO_AUTOMATIC_INVALIDATION"
    relevant_handoff_field_changed: "MARK_DIRECT_DEPENDENTS_DIRTY"
    contract_breaking_change: "MARK_ALL_AFFECTED_DEPENDENTS_DIRTY"

failure_localization_order:
  - "current stage artifact"
  - "current stage compiled input"
  - "direct upstream handoff"
  - "upstream evidence"
  - "upstream archive only if still unresolved"

archive_rule:
  normal_path_reads_archive: false
  fault_path_may_read_targeted_archive: true
