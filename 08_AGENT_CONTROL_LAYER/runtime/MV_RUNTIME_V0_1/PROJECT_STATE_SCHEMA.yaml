state_truth_rules:
  - "A model statement alone cannot change stage status to SEALED."
  - "SEALED requires required artifacts, evidence, Judge PASS, and required Human Gate PASS."
  - "Test-only same-model Judge results must be explicitly marked and do not prove Fresh Judge independence."
  - "A stage reopened after SEALED must increment version."
  - "Contract-breaking upstream change marks affected downstream dependents DIRTY."
  - "Internal implementation changes do not invalidate downstream stages when output contract remains compatible."
