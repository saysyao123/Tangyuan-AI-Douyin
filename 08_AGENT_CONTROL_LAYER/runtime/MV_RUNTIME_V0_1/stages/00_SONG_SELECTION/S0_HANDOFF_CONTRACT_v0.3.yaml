handoff_contract:
  handoff_id: "SONG_SELECTION_HANDOFF"
  version: "0.3"

  required:
    selected_song_family: "string"
    selection_evidence: "object"
    candidate_reference_leads: "array"
    human_song_family_lock:
      status: "PASS"
    stage:
      id: "SONG_SELECTION"
      contract_version: "0.3"
      status: "SEALED"

  optional:
    preferred_reference_lead: "reference_or_null"
    gate_mode: "USER_CONFIRMED|AUTO_CONFIRMED_FOR_TEST"

  deliberately_excluded:
    - acquired_media_file
    - exact_audio_version
    - extracted_audio_file
    - final_segment_start
    - final_segment_end
    - lyric_timeline
    - beat_grid
    - director_plan
