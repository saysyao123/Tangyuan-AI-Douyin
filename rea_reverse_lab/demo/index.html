<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 / REA 游戏规则复刻 P0</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:radial-gradient(circle at 15% 10%,#304057,#10151f 67%);color:#f7eee0}main{width:min(94vw,490px);padding:35px 14px}h1{font-size:64px;letter-spacing:-4px;color:#ffd08a;margin:0}.sub{letter-spacing:2px;color:#a2afc7;font-size:12px}.top{display:flex;align-items:center;justify-content:space-between}.score{display:flex;gap:10px}.score div{border:1px solid #425471;background:#27354a;border-radius:10px;text-align:center;padding:9px 15px;min-width:76px}.score small{display:block;color:#adbed6}.score b{font-size:22px}p{color:#c1ccdb;line-height:1.6}.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:17px 0}.actions span{font-size:13px;color:#c3d0e4}button{border:0;border-radius:10px;background:#eaba6e;color:#182031;padding:12px 15px;font-weight:700;cursor:pointer}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;aspect-ratio:1;background:#2b3a4d;border-radius:13px;touch-action:none}.cell{display:grid;place-items:center;border-radius:8px;background:#1c2a38;color:#172333;font-size:clamp(22px,7vw,39px);font-weight:800}.cell[data-v="2"]{background:#f6edd9}.cell[data-v="4"]{background:#f1daad}.cell[data-v="8"]{background:#f1bb77}.cell[data-v="16"]{background:#f19e70}.cell[data-v="32"]{background:#e98162}.cell[data-v="64"]{background:#e3665a;color:white}.cell[data-v="128"],.cell[data-v="256"]{background:#ebd268}.cell[data-v="512"],.cell[data-v="1024"],.cell[data-v="2048"]{background:#efc349}.cell[data-v="4096"],.cell[data-v="8192"]{background:#50b1cb;color:white}.controls{display:grid;grid-template-columns:repeat(3,54px);gap:6px;justify-content:center;margin:23px auto}.controls button{background:#32445e;color:#fff;font-size:20px}.controls [data-dir="0"]{grid-column:2}.controls [data-dir="3"]{grid-column:1;grid-row:2}.controls [data-dir="2"]{grid-column:2;grid-row:2}.controls [data-dir="1"]{grid-column:3;grid-row:2}.foot{border-top:1px solid #3c4c60;padding-top:14px;color:#9eaabe;text-align:center;font-size:12px}.foot a{color:#edbf81}
</style></head><body><main>
<div class="top"><div><span class="sub">REA / VERIFIED RULES PILOT</span><h1>2048</h1></div><div class="score"><div><small>得分</small><b id="score">0</b></div><div><small>最高</small><b id="best">0</b></div></div></div>
<p>使用方向键或手指滑动合并相同的数字。玩法使用独立实现、经 1,240 组原版差分对照的规则引擎。</p>
<div class="actions"><span id="status" role="status"></span><button id="restart">开始新游戏</button></div>
<div class="board" id="board" aria-label="2048 棋盘"></div>
<div class="controls"><button data-dir="0">↑</button><button data-dir="3">←</button><button data-dir="2">↓</button><button data-dir="1">→</button></div>
<div class="foot">规则参考 MIT 开源 <a href="https://github.com/gabrielecirulli/2048">2048</a> · 独立界面及规则实现 · <a href="https://github.com/morluto/rea">REA</a></div>
<script type="module">
import {step2048} from '../03_reconstruction/engine.mjs';
const $=id=>document.getElementById(id);
let game,best=0;
function newTile(){const empty=[];for(let x=0;x<4;x++)for(let y=0;y<4;y++)if(!game.cells[x][y])empty.push([x,y]);if(!empty.length)return;const v=Math.random()<.9?2:4,[x,y]=empty[Math.floor(Math.random()*empty.length)];game.cells[x][y]=v}
function reset(){game={cells:Array.from({length:4},()=>[0,0,0,0]),score:0,over:false,won:false,keepPlaying:false};newTile();newTile();render()}
function render(){const board=$('board');board.replaceChildren();for(let y=0;y<4;y++)for(let x=0;x<4;x++){const v=game.cells[x][y],d=document.createElement('div');d.className='cell';d.dataset.v=v;d.textContent=v||'';board.appendChild(d)}$('score').textContent=game.score;best=Math.max(game.score,best);$('best').textContent=best;$('status').textContent=game.over?'游戏结束':game.won?'成功合出 2048！':'方向键 / 滑动操作'}
function move(dir){game=step2048(game,dir,Math.random);render()}
document.addEventListener('keydown',e=>{const dir={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3}[e.key];if(dir!==undefined){e.preventDefault();move(dir)}});$('restart').addEventListener('click',reset);
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>move(+b.dataset.dir)));
let start=null;const board=$('board');board.addEventListener('touchstart',e=>{start={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY}},{passive:true});board.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;start=null;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0))},{passive:true});reset();
</script></main></body></html>
