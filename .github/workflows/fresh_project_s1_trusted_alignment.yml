name: Fresh Project S1 Trusted Lyrics Alignment

on:
  push:
    branches: [main]
    paths:
      - '08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/runs/FRESH_PROJECT_RUN01_2026-09-26/S1_ALIGN_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source and trusted lyrics
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp requests beautifulsoup4
          mkdir -p align_audio align_jobs/job align_models align_public
          yt-dlp --no-playlist --no-cookies -x --audio-format mp3 --audio-quality 0 -o 'align_audio/full.%(ext)s' 'https://peachillusion.bandcamp.com/track/-'
          python - <<'PY'
          import hashlib,re,requests
          from bs4 import BeautifulSoup
          url='https://peachillusion.bandcamp.com/track/-'
          html=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          soup=BeautifulSoup(html,'html.parser')
          node=soup.select_one('.lyricsText') or soup.find(attrs={'class':re.compile('lyrics')})
          if node is None: raise SystemExit('lyrics node not found')
          fragment=node.decode_contents()
          raw=node.get_text('\n',strip=False)
          sep_stats={
            'br_tags':len(re.findall(r'(?i)<br\\s*/?>',fragment)),
            'nbsp_entities':fragment.count('&nbsp;'),
            'unicode_nbsp':raw.count('\u00a0'),
            'raw_newlines':raw.count('\n')
          }
          frag=re.sub(r'(?i)<br\\s*/?>','\n',fragment)
          text=BeautifulSoup(frag,'html.parser').get_text('\n',strip=False)
          text=text.replace('\r','')
          text=re.sub(r'\u00a0+','\n',text)
          text=re.sub(r'[ \\t]{2,}','\n',text)
          candidates=[re.sub(r'[ \\t]+',' ',x).strip() for x in text.split('\n')]
          lines=[x for x in candidates if x and x.lower() not in {'lyrics','credits','about'}]
          lines=[x for x in lines if not x.lower().startswith('from time')]
          if len(lines)==8:
              expanded=[]
              for block in lines:
                  expanded.extend([x.strip() for x in block.split(' ') if x.strip()])
              lines=expanded
          if len(lines)<20:
              flat=node.get_text(' ',strip=True)
              flat=flat.replace('\u00a0','  ')
              lines=[x.strip() for x in re.split(r'[ \\t]{2,}',flat) if x.strip()]
              if len(lines)==8:
                  expanded=[]
                  for block in lines:
                      expanded.extend([x.strip() for x in block.split(' ') if x.strip()])
                  lines=expanded
          open('align_jobs/job/trusted_lyrics.txt','w',encoding='utf-8').write('\n'.join(lines)+'\n')
          meta={'line_count':len(lines),'sha256':hashlib.sha256(('\n'.join(lines)).encode()).hexdigest(),'char_count':sum(map(len,lines)),'separator_stats':sep_stats}
          import json; open('align_public/lyrics_meta.json','w').write(json.dumps(meta,ensure_ascii=False,indent=2))
          print(meta)
          if not 24 <= len(lines) <= 32: raise SystemExit(f'unexpected lyrics line count {len(lines)}')
          sections={
            'version':1,'line_index_base':0,'line_end_inclusive':False,
            'sections':[
              {'id':'verse1','audio_start':0.0,'audio_end':46.068,'line_start':0,'line_end':6,'kind':'singing'},
              {'id':'chorus1','audio_start':46.068,'audio_end':78.437,'line_start':6,'line_end':14,'kind':'singing'},
              {'id':'verse2','audio_start':78.437,'audio_end':122.207,'line_start':14,'line_end':20,'kind':'singing'},
              {'id':'chorus2','audio_start':122.207,'audio_end':192.702,'line_start':20,'line_end':28,'kind':'singing'}
            ]
          }
          open('align_jobs/job/sections.json','w',encoding='utf-8').write(json.dumps(sections,ensure_ascii=False,indent=2))
          PY
          sudo chown -R 10001:10001 align_jobs align_models
      - name: Pull Xingyu CPU image
        run: docker pull ghcr.io/wangjiqing/xingyu-lyrics-aligner:latest
      - name: Pull Chinese alignment model
        run: |
          docker run --rm \
            -v "$PWD/align_models:/models" \
            ghcr.io/wangjiqing/xingyu-lyrics-aligner:latest \
            xingyu-align models pull --language zh --device cpu
      - name: Align trusted lyrics
        run: |
          docker run --rm \
            -v "$PWD/align_audio:/music:ro" \
            -v "$PWD/align_jobs:/jobs" \
            -v "$PWD/align_models:/models" \
            ghcr.io/wangjiqing/xingyu-lyrics-aligner:latest \
            xingyu-align align \
              --audio /music/full.mp3 \
              --lyrics /jobs/job/trusted_lyrics.txt \
              --output-dir /jobs/job/result \
              --language zh \
              --device cpu \
              --section-manifest /jobs/job/sections.json \
              --json-result > align_public/cli_result.json
      - name: Sanitize and validate alignment
        run: |
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          root=Path('align_jobs/job/result')
          align=json.loads((root/'alignment.json').read_text(encoding='utf-8'))
          report=json.loads((root/'report.json').read_text(encoding='utf-8'))
          trusted=[x.strip() for x in Path('align_jobs/job/trusted_lyrics.txt').read_text(encoding='utf-8').splitlines() if x.strip()]
          raw_lines=align.get('lines',[])
          aligned=[]
          for x in raw_lines:
              idx=int(x.get('index',-1))+1
              start=x.get('start'); end=x.get('end')
              txt=x.get('text','')
              if idx<1 or start is None or end is None: continue
              aligned.append({
                'line_id':idx,
                'start_ms':round(float(start)*1000),
                'end_ms':round(float(end)*1000),
                'status':x.get('status'),
                'section_id':x.get('section_id'),
                'text_sha8':hashlib.sha256(txt.encode()).hexdigest()[:8]
              })
          aligned=sorted(aligned,key=lambda r:r['line_id'])
          summary={
            'tool':'XINGYU_LYRICS_ALIGNER_SECTIONED',
            'trusted_line_count':len(trusted),
            'matched_line_count':len(aligned),
            'warnings':report.get('warnings',[]),
            'report_summary':{k:v for k,v in report.items() if k not in ['lyrics','lines','tokens'] and isinstance(v,(str,int,float,bool,type(None)))},
            'lines':aligned
          }
          byid={r['line_id']:r for r in aligned}
          required=list(range(1,29))
          if any(i not in byid for i in required):
              summary['status']='MISSING_ALIGNED_LINES'
              Path('align_public/alignment_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit('missing aligned lines')
          durations=[(r['end_ms']-r['start_ms'])/1000 for r in aligned]
          monotonic=all(aligned[i]['start_ms']>=aligned[i-1]['end_ms']-50 for i in range(1,len(aligned)))
          c1={'start_ms':byid[7]['start_ms'],'end_ms':byid[14]['end_ms']}
          c2={'start_ms':byid[21]['start_ms'],'end_ms':byid[28]['end_ms']}
          checks={
            'all_28_lines':len(aligned)==28,
            'character_count_matches':bool(report.get('character_count_matches')),
            'non_monotonic_zero':int(report.get('non_monotonic_line_count',999))==0,
            'missing_chars_zero':int(report.get('missing_character_timestamps',999))==0,
            'monotonic':monotonic,
            'max_line_duration_le_12s':max(durations)<=12.0,
            'chorus1_in_section':45000<=c1['start_ms']<80000 and 45000<c1['end_ms']<=80000,
            'chorus2_in_section':120000<=c2['start_ms']<193000 and 120000<c2['end_ms']<=193000,
            'choruses_distinct':c2['start_ms']>c1['end_ms']+30000
          }
          summary.update({'checks':checks,'max_line_duration_seconds':max(durations),'chorus1':c1,'chorus2':c2})
          if not all(checks.values()):
              summary['status']='ALIGNMENT_QUALITY_REJECTED'
              Path('align_public/alignment_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
              raise SystemExit('alignment quality rejected')
          summary['status']='PASS_LINE_LEVEL'
          Path('align_public/alignment_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          start=max(0,c1['start_ms']/1000-0.20); end=c1['end_ms']/1000+0.30
          out='align_public/桃子假象_告别_S1_FINAL_ALIGNED.mp3'
          subprocess.check_call(['ffmpeg','-y','-v','error','-ss',f'{start:.3f}','-to',f'{end:.3f}','-i','align_audio/full.mp3','-c:a','libmp3lame','-q:a','2',out])
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,bit_rate:stream=sample_rate,channels,codec_name','-of','json',out],text=True))
          delivery={'source_chorus_start_seconds':c1['start_ms']/1000,'source_chorus_end_seconds':c1['end_ms']/1000,'render_start_seconds':start,'render_end_seconds':end,'rendered_duration_seconds':float(probe['format']['duration']),'artifact_sha256':hashlib.sha256(open(out,'rb').read()).hexdigest(),'probe':probe}
          Path('align_public/final_audio_meta.json').write_text(json.dumps(delivery,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload private alignment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-s1-trusted-alignment
          path: |
            align_jobs/job/result/
            align_public/
          retention-days: 7
      - name: Publish sanitized result only
        if: always()
        run: |
          DEST='08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/runs/FRESH_PROJECT_RUN01_2026-09-26/s1_forced_alignment'
          mkdir -p "$DEST"
          cp align_public/lyrics_meta.json "$DEST/lyrics_meta.json" || true
          cp align_public/alignment_summary.json "$DEST/alignment_summary.json" || true
          cp align_public/final_audio_meta.json "$DEST/final_audio_meta.json" || true
          git config user.name 'tangyuan-fresh-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then echo no-change; else git commit -m 'fresh-run: publish trusted lyric alignment summary'; git push; fi