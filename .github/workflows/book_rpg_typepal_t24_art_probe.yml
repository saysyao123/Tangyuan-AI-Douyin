name: T24 original Type PAL high-DPI visual layer probe
on:
  push:
    branches: ['feature/t24-hd-first-act-playable-20261017']
    paths:
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t24/**'
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t24-ambient-render-e2e.mjs'
      - '.github/workflows/book_rpg_typepal_t24_art_probe.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  render-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with: {path: source, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: saysyao123/Tangyuan-AI-Douyin
          ref: t23-journey-preview
          path: t23site
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IllegalCreed/type-pal
          ref: f98d0ddd89ebdee7b04502ee35de26ee82c6d246
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - run: pnpm install --frozen-lockfile
        working-directory: upstream
      - name: Preserve T23 production-ready existing website and gameplay
        run: |
          python3 source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t24/apply-probe.py t23site t24site
          cmp t23site/chapter/shell.js t24site/chapter/shell.js
          cmp t23site/chapter/config.js t24site/chapter/config.js
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: upstream
      - name: Start isolated local browser preview
        run: |
          python3 -m http.server 6154 --bind 127.0.0.1 --directory . >/tmp/t24-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:6154/t24site/chapter/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/t24-http.log
          exit 1
      - name: Validate real Type PAL scene and HD canvas layer
        working-directory: upstream
        run: |
          cp ../source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t24-ambient-render-e2e.mjs ./
          node t24-ambient-render-e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: t24-scene-lighting-probe-qa, path: /tmp/t24-evidence/, retention-days: 30}
      - name: Publish isolated art prototype only, NOT the approved first act
        if: success()
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd t24site
          git init -q
          git config user.name "T24 Experiment CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -qb t24-art-probe-preview
          git add -A
          git commit -qm "T24 camera-synchronized presentation experiment (not art approved)"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/t24-art-probe-preview --force
