name: R3 HG01 Core Database Guard Tests

on:
  push:
    branches:
      - test/mv-oss-optimization-r1
    paths:
      - '04_HARNESS/runtime/mv_artifact_registry.json'
      - '04_HARNESS/runtime/mv_human_gate_registry.json'
      - '04_HARNESS/runtime/mv_stage_registry.json'
      - '04_HARNESS/rules/mv_human_gates.md'
      - '04_HARNESS/rules/mv_stage_entry_checklist.md'
      - '04_HARNESS/tools/mv_runtime_gate.py'
      - '04_HARNESS/tools/mv_runtime_state.py'
      - '06_TESTS/MV/WEB_R3/30D_60/D02-B/01_SONG/**'
      - '06_TESTS/MV/OSS_OPT_R1/HG01_GATE_HARDENING_v1.md'
      - '.github/workflows/r3-hg01-delivery-guard-tests.yml'
  workflow_dispatch:

jobs:
  hg01-core-database-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry integrity
        run: python 04_HARNESS/tools/mv_runtime_gate.py registry-check

      - name: Live D02-B reset must remain blocked before database rebuild
        shell: bash
        run: |
          set +e
          python 04_HARNESS/tools/mv_runtime_gate.py artifact-check \
            --slot-root 06_TESTS/MV/WEB_R3/30D_60/D02-B \
            --artifact SONG_CANDIDATE_SET \
            > /tmp/hg01-live-candidate.json
          candidate_code=$?
          python 04_HARNESS/tools/mv_runtime_gate.py artifact-check \
            --slot-root 06_TESTS/MV/WEB_R3/30D_60/D02-B \
            --artifact HG01_CANDIDATE_EVIDENCE_PACK \
            > /tmp/hg01-live-pack.json
          pack_code=$?
          set -e
          cat /tmp/hg01-live-candidate.json
          cat /tmp/hg01-live-pack.json
          if [ "$candidate_code" -ne 1 ] || [ "$pack_code" -ne 1 ]; then
            echo "Expected reset D02-B HG01 artifacts to remain blocked until core database candidate rebuild"
            exit 1
          fi

      - name: Core database policy must be explicit
        shell: bash
        run: |
          grep -q 'CORE BENCHMARK ACCOUNTS -> DATA CENTER' 04_HARNESS/rules/mv_human_gates.md
          grep -q 'CORE_BENCHMARK_DATABASE' 04_HARNESS/rules/mv_human_gates.md
          grep -q 'CORE_CREATOR_MV_DIRECT' 04_HARNESS/rules/mv_human_gates.md
          grep -q 'broad web-wide song search' 04_HARNESS/rules/mv_stage_entry_checklist.md
          echo 'PASS: HG01 discovery strategy is core-database-first and broad web song search is blocked as default'

      - name: Synthetic core-database HG01 must pass canonical RECORD ADVANCE VERIFY chain
        shell: bash
        run: |
          cp -a 06_TESTS/MV/WEB_R3/30D_60/D02-B /tmp/D02-B-core-positive
          python - <<'PY'
          import json
          from pathlib import Path

          candidate_path = Path('/tmp/D02-B-core-positive/01_SONG/SONG_CANDIDATE_SET.json')
          data = json.loads(candidate_path.read_text(encoding='utf-8'))
          data['status'] = 'HG01_EVIDENCE_DELIVERY_PASS'
          assert data['selection_policy']['source_mode'] == 'CORE_BENCHMARK_DATABASE'
          assert data['selection_policy']['broad_web_song_search'] is False
          data['formal_candidates'] = [
              {
                  'candidate_id': 'A',
                  'song_family': 'SYNTHETIC_CORE_REPEAT',
                  'database_sources': [
                      {'account': 'CORE_ACCOUNT_1', 'work_url': 'https://www.douyin.com/video/111'},
                      {'account': 'CORE_ACCOUNT_2', 'work_url': 'https://www.douyin.com/video/222'}
                  ]
              }
          ]
          data['evidence_delivery_guard'] = {
              'evidence_pack_path': '01_SONG/HG01_CANDIDATE_EVIDENCE_PACK_v1.md',
              'all_candidates_min_direct_works_2': True,
              'all_candidates_independent_accounts_2plus': True,
              'all_direct_links_landing_work_verified': True,
              'core_account_coverage_reported': True,
              'no_external_audio_substitution': True,
              'user_gate_delivery_mode': 'DIRECT_WORKS_FIRST'
          }
          data['delivery_integrity']['all_delivery_links_landing_work_verified'] = True
          candidate_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          pack_path = Path('/tmp/D02-B-core-positive/01_SONG/HG01_CANDIDATE_EVIDENCE_PACK_v1.md')
          pack_path.write_text('''# SYNTHETIC CORE DATABASE HG01 PACK\n\nSOURCE_MODE = CORE_BENCHMARK_DATABASE\nDELIVERY_MODE = CORE_CREATOR_MV_DIRECT\n\nCandidate A: SYNTHETIC_CORE_REPEAT\n- CORE_ACCOUNT_1 corresponding MV: https://www.douyin.com/video/111\n- CORE_ACCOUNT_2 corresponding MV: https://www.douyin.com/video/222\n\nLANDING_WORK identity verified for delivered links.\n\nHG01_EVIDENCE_DELIVERY_PASS = YES\nDIRECT_DOUYIN_EVIDENCE_PACK_READY = YES\nCORE_ACCOUNT_COVERAGE_REPORTED = YES\nALL_DIRECT_LINKS_LANDING_WORK_VERIFIED = YES\nNO_EXTERNAL_AUDIO_LINK_SUBSTITUTION = YES\nUSER_GATE_DELIVERY_MODE = DIRECT_WORKS_FIRST\nEVIDENCE_LOCATION = LANDING_WORK\n''', encoding='utf-8')
          PY

          python 04_HARNESS/tools/mv_runtime_gate.py artifact-check \
            --slot-root /tmp/D02-B-core-positive \
            --artifact SONG_CANDIDATE_SET
          python 04_HARNESS/tools/mv_runtime_gate.py artifact-check \
            --slot-root /tmp/D02-B-core-positive \
            --artifact HG01_CANDIDATE_EVIDENCE_PACK

          python 04_HARNESS/tools/mv_runtime_state.py record-human-gate \
            --slot-root /tmp/D02-B-core-positive \
            --gate HG01 \
            --user-decision-text 'SYNTHETIC_USER_SELECTED_CORE_DATABASE_CANDIDATE' \
            --approved-artifact '01_SONG/HG01_CANDIDATE_EVIDENCE_PACK_v1.md' \
            > /tmp/hg01-core-record.json
          cat /tmp/hg01-core-record.json

          python 04_HARNESS/tools/mv_runtime_state.py advance \
            --slot-root /tmp/D02-B-core-positive \
            --to S01_HG01_SONG_LOCKED \
            > /tmp/hg01-core-advance.json
          cat /tmp/hg01-core-advance.json

          python 04_HARNESS/tools/mv_runtime_state.py verify-state \
            --slot-root /tmp/D02-B-core-positive \
            > /tmp/hg01-core-verify.json
          cat /tmp/hg01-core-verify.json

          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('/tmp/hg01-core-record.json').read_text(encoding='utf-8'))
          advance = json.loads(Path('/tmp/hg01-core-advance.json').read_text(encoding='utf-8'))
          verify = json.loads(Path('/tmp/hg01-core-verify.json').read_text(encoding='utf-8'))
          assert record['ok'] is True, record
          assert advance['ok'] is True, advance
          assert verify['ok'] is True, verify
          assert verify['current_stage'] == 'S01_HG01_SONG_LOCKED', verify
          print('PASS: core-database HG01 can complete canonical RECORD -> ADVANCE -> VERIFY')
          PY
