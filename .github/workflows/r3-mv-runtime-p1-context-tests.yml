name: R3 MV Runtime P1 Context Tests

on:
  push:
    branches:
      - refactor/mv-runtime-consolidation-v2
    paths:
      - '04_HARNESS/runtime/**'
      - '04_HARNESS/tools/mv_runtime_gate.py'
      - '04_HARNESS/tools/mv_runtime_state.py'
      - '.github/workflows/r3-mv-runtime-p1-context-tests.yml'
  workflow_dispatch:

jobs:
  context-escalation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build canonical slot through S08
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/mv-context
          rm -rf "$ROOT"
          python 04_HARNESS/tools/mv_runtime_state.py init-slot --slot-root "$ROOT" --slot-id CI-CONTEXT --program CI --lane P

          cat > "$ROOT/01_SONG/SONG_CANDIDATE_SET.json" <<'JSON'
          {"schema_version":"1.0","status":"MACHINE_SCREENED","candidates":[{"id":"C1","title":"fixture healing song","eligible":true}]}
          JSON
          python 04_HARNESS/tools/mv_runtime_state.py record-human-gate --slot-root "$ROOT" --gate HG01 --user-decision-text 'select C1' --approved-artifact 'song:C1'
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S01_HG01_SONG_LOCKED

          cat > "$ROOT/02_BGM/BGM_CANDIDATE_PACKAGE.json" <<'JSON'
          {"schema_version":"1.0","status":"MACHINE_VERIFIED","audio_identity":"fixture-audio","variants":[{"id":"B","duration_s":26.4,"fade":"soft"}]}
          JSON
          python 04_HARNESS/tools/mv_runtime_state.py record-human-gate --slot-root "$ROOT" --gate HG02 --user-decision-text 'approve B' --approved-artifact 'bgm:B'
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S02_HG02_BGM_LOCKED

          cat > "$ROOT/03_AUDIO_TIMELINE/package_manifest.json" <<'JSON'
          {"schema_version":"1.0","status":"LOCKED","audio_identity":"fixture-audio","coverage":1.0}
          JSON
          cat > "$ROOT/03_AUDIO_TIMELINE/alignment_qa_report.md" <<'MD'
          # Alignment QA
          PASS / LOCKED. coverage=1.0; all lines aligned; no warnings.
          MD
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S03_AUDIO_TIMELINE_LOCKED

          cat > "$ROOT/04_BEATS/NATURAL_BEAT.md" <<'MD'
          # Natural Beat
          LOCKED. This synthetic fixture contains a complete semantic beat allocation with enough durable content to satisfy the creative-manifest minimum size requirement. It is intentionally not a production song design.
          MD
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S04_NATURAL_BEAT_LOCKED

          cat > "$ROOT/05_DIRECTOR/DIRECTOR_BEAT_MAP.md" <<'MD'
          # Director Beat Map
          LOCKED. Each synthetic production segment has a semantic role, visual task, camera relationship, subject task and edit role. This is CI evidence only and deliberately exceeds the required minimum size.
          MD
          cat > "$ROOT/05_DIRECTOR/DIRECTOR_PLAN.md" <<'MD'
          # Director Plan
          LOCKED. Synthetic director plan for Runtime CI. Segment S01 establishes the world; S02 carries the lyric event; S03 provides support behavior; S04 opens space; S05 changes the visual field; S06 resolves. Each segment contains a distinct composition, camera-subject relationship, K0 state, one primary event and clean endpoint. This text exists only to validate durable stage enforcement and is not a reusable creative template.
          MD
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S05_DIRECTOR_PLAN_LOCKED

          cat > "$ROOT/06_FIRST_FRAMES/FIRST_FRAME_SET_MANIFEST.json" <<'JSON'
          {"schema_version":"1.0","status":"MACHINE_QA_PASS","frames":[{"id":"S01","asset":"fixture-k0-01"},{"id":"S02","asset":"fixture-k0-02"}]}
          JSON
          cat > "$ROOT/06_FIRST_FRAMES/FIRST_FRAME_SET_QA.md" <<'MD'
          # First Frame Set QA
          PASS / ACCEPT / LOCK. Set-level composition, continuity, lyric hit, K0 performability and differentiation checks passed for this synthetic fixture.
          MD
          python 04_HARNESS/tools/mv_runtime_state.py record-human-gate --slot-root "$ROOT" --gate HG03 --user-decision-text 'fixture first frames accepted' --approved-artifact 'first-frame-set:fixture-v1'
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S06_HG03_FIRST_FRAMES_LOCKED

          cat > "$ROOT/07_DYNAMIC/DYNAMIC_PROMPT_SET.md" <<'MD'
          # Dynamic Prompt Set
          READY. Synthetic prompt contract. Every source inherits the accepted K0, freezes identity and topology, has one main subject event, one camera relationship, bounded motion load, explicit phases, physical feedback, residue, clean endpoint, sound prohibition and avoid list. This file is deliberately long enough for the production-manifest minimum and exists solely for Runtime CI.
          MD
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S07_DYNAMIC_PROMPT_SET_READY

          cat > "$ROOT/07_DYNAMIC/DYNAMIC_SOURCE_QA.md" <<'MD'
          # Dynamic Source QA
          PASS / LOCKED_FOR_EDIT. Source topology inspection proves that one generated source contains multiple perceptible internal shots and therefore requires normalization before Picture Edit.
          MD
          cat > "$ROOT/07_DYNAMIC/VISUAL_SOURCE_MAP.csv" <<'CSV'
          source_id,status,internal_shots,edit_role
          S01,PASS,2,setup_event
          S02,PASS,1,release
          CSV
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S08_DYNAMIC_SOURCE_QA_LOCKED
          python 04_HARNESS/tools/mv_runtime_state.py verify-state --slot-root "$ROOT"

      - name: Escalate multi-shot context and force normalization
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/mv-context

          set +e
          python 04_HARNESS/tools/mv_runtime_state.py update-context --slot-root "$ROOT" --key web --value false --reason 'must be immutable' > /tmp/immutable-context.json
          immutable_code=$?
          set -e
          test "$immutable_code" -eq 1

          python 04_HARNESS/tools/mv_runtime_state.py update-context --slot-root "$ROOT" --key multi_shot --value true --reason 'locked Dynamic QA proves multiple perceptible internal shots'
          python 04_HARNESS/tools/mv_runtime_state.py verify-state --slot-root "$ROOT" > /tmp/context-verified.json
          cat /tmp/context-verified.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('/tmp/mv-context/00_STATE/CURRENT_STATE.json').read_text())
          assert state['current_stage'] == 'S08_DYNAMIC_SOURCE_QA_LOCKED'
          assert state['context']['multi_shot'] is True
          assert state['context_revision'] == 1
          assert state['last_context_receipt_sha256']
          report = json.loads(Path('/tmp/context-verified.json').read_text())
          assert report['context']['multi_shot'] is True
          assert len(report['checked_context_receipts']) == 1
          print('PASS: context derives from manifest plus one immutable event')
          PY

          set +e
          python 04_HARNESS/tools/mv_runtime_state.py update-context --slot-root "$ROOT" --key multi_shot --value false --reason 'relax normalization' > /tmp/context-relax.json
          relax_code=$?
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S09_SOURCE_NORMALIZATION_READY > /tmp/s09-before-normalization.json
          s09_code=$?
          set -e
          test "$relax_code" -eq 1
          test "$s09_code" -eq 1
          grep -q 'SHOT_LIBRARY_MAP' /tmp/s09-before-normalization.json
          grep -q 'WEB_SOURCE_ROUGH_CUT_MAP' /tmp/s09-before-normalization.json

          cat > "$ROOT/08_NORMALIZATION/NORMALIZED_SHOT_LIBRARY_MAP.csv" <<'CSV'
          atom_id,source_id,start_s,end_s,role
          A01,S01,0.0,2.4,setup
          A02,S01,2.4,5.0,event
          A03,S02,0.0,5.0,release
          CSV
          cat > "$ROOT/08_NORMALIZATION/SHOT_LIBRARY_QA.md" <<'MD'
          # Shot Library QA
          PASS / READY / LOCKED. Internal perceptible shots are mapped into clean editing atoms and no duplicate or topology-risk micro-shot remains.
          MD
          cat > "$ROOT/08_NORMALIZATION/WEB_SOURCE_ROUGH_CUT_MAP.csv" <<'CSV'
          source_id,proxy,status
          S01,S01_clean.mp4,CLEAN
          S02,S02_clean.mp4,CLEAN
          CSV
          cat > "$ROOT/08_NORMALIZATION/WEB_SOURCE_ROUGH_CUT_QA.md" <<'MD'
          # WEB Source Rough-Cut QA
          PASS / WATERMARK SAFE / CLEAN. Uniform source normalization is complete and source audio is removed.
          MD
          python 04_HARNESS/tools/mv_runtime_state.py advance --slot-root "$ROOT" --to S09_SOURCE_NORMALIZATION_READY
          python 04_HARNESS/tools/mv_runtime_state.py verify-state --slot-root "$ROOT"

          set +e
          python 04_HARNESS/tools/mv_runtime_state.py update-context --slot-root "$ROOT" --key multi_shot --value true --reason 'too late' > /tmp/context-late.json
          late_code=$?
          set -e
          test "$late_code" -eq 1
          echo 'PASS: multi-shot discovery escalates, never relaxes, and forces S09 normalization before edit.'

      - name: Detect manual context tampering
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mv-context-tamper
          cp -a /tmp/mv-context /tmp/mv-context-tamper
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/mv-context-tamper/00_STATE/CURRENT_STATE.json')
          data = json.loads(p.read_text())
          data['context']['multi_shot'] = False
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY
          set +e
          python 04_HARNESS/tools/mv_runtime_state.py verify-state --slot-root /tmp/mv-context-tamper > /tmp/context-tamper.json
          code=$?
          set -e
          cat /tmp/context-tamper.json
          test "$code" -eq 1
          grep -q 'context does not match' /tmp/context-tamper.json
          echo 'PASS: direct CURRENT_STATE context edits are detected.'
