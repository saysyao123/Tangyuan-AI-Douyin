name: R3 MV Runtime Web Bridge

on:
  push:
    branches:
      - refactor/mv-runtime-consolidation-v2
      - test/mv-web-r3
      - test/mv-oss-optimization-r1
    paths:
      - '04_HARNESS/runtime_bridge/requests/*.json'
      - '06_TESTS/MV/OSS_OPT_R1/requests/D02B_AUDIO_TIMELINE_BUILD*.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mv-runtime-web-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute-runtime-requests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest branch truth before execution
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Process pending immutable Runtime requests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -B 04_HARNESS/tools/mv_runtime_bridge.py process-pending

      - name: Build D02-B trusted Audio Timeline only for explicit sentinel
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT="$(git log -1 --pretty=%s)"
          if [ "$SUBJECT" != 'test: trigger D02-B Audio Timeline build' ]; then
            echo 'Not an Audio Timeline sentinel commit; skip builder.'
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          set +e
          bash 04_HARNESS/tools/d02b_audio_timeline_build.sh
          CODE=$?
          set -e
          mkdir -p 06_TESTS/MV/WEB_R3/30D_60/D02-B/03_AUDIO_TIMELINE
          printf '%s\n' "$CODE" > 06_TESTS/MV/WEB_R3/30D_60/D02-B/03_AUDIO_TIMELINE/build_exit_code.txt
          echo "Audio Timeline builder exit code: $CODE"

      - name: Commit Runtime responses, authoritative mutations, and explicit Audio Timeline outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A -- \
            04_HARNESS/runtime_bridge/responses \
            06_TESTS/MV/WEB_R3/30D_60 \
            05_IP_ASSETS/MV_30D_60_TRACKER.csv

          if ! git diff --cached --quiet -- 04_HARNESS/runtime_bridge/requests; then
            echo 'ERROR: bridge writeback attempted to modify immutable request files.'
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'No pending Runtime response, mutation, or Audio Timeline output to commit.'
            exit 0
          fi

          git commit -m "runtime: process MV web bridge request(s)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
