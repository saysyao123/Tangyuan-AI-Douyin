name: T35 no legacy art flash during loading and transitions
on:
  push:
    branches: ['feature/t35-no-legacy-flash-20261018']
    paths:
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t32/**'
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/art/t32/**'
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t35-*-e2e.mjs'
      - '.github/workflows/book_rpg_t35_no_flash.yml'
  workflow_dispatch:
permissions: {contents: write, actions: read}
jobs:
  integrate-and-play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {path: source, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: saysyao123/Tangyuan-AI-Douyin
          ref: 146298ede54a65025ab7a794b49ab53c4bf3ae92
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IllegalCreed/type-pal
          ref: f98d0ddd89ebdee7b04502ee35de26ee82c6d246
          path: upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: saysyao123/Tangyuan-AI-Douyin
          ref: e3de3a907e6cb6b1be93887524c14ee76081310d
          path: previous
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - run: pnpm install --frozen-lockfile
        working-directory: upstream
      - name: Materialize verified original art bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json
          root=Path('source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/art/t32')
          manifest=json.loads((root/'ART_MANIFEST.json').read_text())
          for name,sha in manifest['files'].items():
            p=root/name
            if not p.exists():p.write_bytes(base64.b64decode((root/(name+'.b64')).read_text()))
            assert hashlib.sha256(p.read_bytes()).hexdigest()==sha,name
          print('ORIGINAL_HD_BYTES_VERIFIED',len(manifest['files']))
          PY
      - name: Build visual-only native patch and retain exact existing game
        run: node source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t32/build.mjs upstream candidate site
      - name: Typecheck changed renderer in shipped source
        working-directory: upstream/packages/reforge
        run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: upstream
      - name: Serve isolated candidate and unchanged T30 control
        run: |
          python3 -m http.server 6154 --bind 127.0.0.1 --directory . >/tmp/t32-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:6154/site/chapter/game/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Keep proven story, map and shell bytes unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path('candidate/chapter/game/projects/book-pilot-cinematic')
          b=Path('site/chapter/game/projects/book-pilot-cinematic')
          files=[p for p in a.rglob('*') if p.is_file()]
          assert len(files)>30
          for p in files:assert p.read_bytes()==(b/p.relative_to(a)).read_bytes(),p
          print('NATIVE_PROJECT_BYTES_UNCHANGED',len(files))
          import json,hashlib
          old=Path('previous/chapter/game/t32-art')
          for p in old.glob('*.webp'):assert p.read_bytes()==(Path('site/chapter/game/t32-art')/p.name).read_bytes(),p
          assert Path('source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t32/room-world.ts').read_bytes()==Path('upstream/packages/reforge/src/room-world.ts').read_bytes()
          print('ALL_ACCEPTED_T34_RASTER_BYTES_RETAINED',len(list(old.glob('*.webp'))))
          PY
      - name: Only delayed and failed art loading, first scene transition, layered rendering and save restore
        working-directory: upstream
        run: |
          cp ../source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t35-no-legacy-flash-e2e.mjs .
          node t35-no-legacy-flash-e2e.mjs
      - name: Collect corresponding evidence and candidate package
        if: always()
        run: |
          mkdir -p /tmp/t35-evidence/story
          if test -d site; then
            mkdir -p site/t35-evidence
            cp -a /tmp/t35-evidence/. site/t35-evidence/
            cd site && zip -qr /tmp/T35_NO_FLASH_CANDIDATE.zip .
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t35-no-legacy-flash
          path: |
            /tmp/t35-evidence/
            /tmp/T35_NO_FLASH_CANDIDATE.zip
          retention-days: 30
      - name: Publish isolated review branch after technical tests; art gate remains pending review
        if: success()
        env: {PUSH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          cd site
          git init -q
          git config user.name 'T32 Integration CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -qb t35-no-flash-candidate
          git add -A
          git commit -qm 'T35 decoded art barrier, no legacy loading fallback; all accepted images retained'
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/t35-no-flash-candidate --force
