name: T27 continuous first-act versus unmodified T23 baseline
on:
  push:
    branches: ['feature/t27-act1-character-integration-preview-20261017']
    paths: ['.github/workflows/book_rpg_t27_continuity_parity.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  first-act-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {path: source, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: saysyao123/Tangyuan-AI-Douyin
          ref: t23-journey-preview
          path: original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: saysyao123/Tangyuan-AI-Douyin
          ref: t27-act1-playtest
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IllegalCreed/type-pal
          ref: f98d0ddd89ebdee7b04502ee35de26ee82c6d246
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - run: pnpm install --frozen-lockfile
        working-directory: upstream
      - name: Patch only obsolete T15 post-ending scene expectation for T18/T23/T27 continuity
        run: |
          cp source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t15-cinematic-e2e.mjs upstream/t27-first-act-continuity.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('upstream/t27-first-act-continuity.mjs')
          s=p.read_text()
          before="assert.equal((await state()).sceneId,'courtyard');assert.equal((await state()).story.flags.chapter_complete,true);assert.deepEqual((await state()).position,end.position)"
          after="const resumed=await state();assert.ok(['courtyard','home-room'].includes(resumed.sceneId),'unexpected saved first-act end scene '+resumed.sceneId);assert.equal(resumed.story.flags.chapter_complete,true);if(resumed.sceneId==='courtyard')assert.deepEqual(resumed.position,end.position)"
          assert s.count(before)==1, 'original test has changed: stop instead of overriding'
          p.write_text(s.replace(before,after))
          # T16 replaced the obsolete /pilot/ navigation entry with /night/.
          old_link="assert.ok(await page.locator('a[href=\"../pilot/\"]').count());"
          new_link="assert.ok(await page.locator('nav a[href=\"../night/\"]').count());"
          assert s.count(old_link)==1, 'legacy UI assertion did not match'
          p.write_text(s.replace(old_link,new_link))
          print('T27_T15_LEGACY_END_SCENE_AND_NAV_ASSERTIONS_UPDATED')
          PY
          rm -rf upstream/projects/book-pilot-cinematic
          cp -a candidate/chapter/game/projects/book-pilot-cinematic upstream/projects/book-pilot-cinematic
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: upstream
      - name: Host original and T27 at same origin without rebuilding either
        run: |
          python3 -m http.server 6154 --bind 127.0.0.1 --directory . >/tmp/t27-parity-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:6154/candidate/chapter/game/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Original T23 full fair-to-home route baseline
        working-directory: upstream
        env: {T1_URL: "http://127.0.0.1:6154/original"}
        run: |
          node t27-first-act-continuity.mjs
          mkdir -p /tmp/t27-parity
          mv /tmp/t15-evidence /tmp/t27-parity/original-t23
      - name: T27 updated-character identical full fair-to-home route
        working-directory: upstream
        env: {T1_URL: "http://127.0.0.1:6154/candidate"}
        run: |
          node t27-first-act-continuity.mjs
          mv /tmp/t15-evidence /tmp/t27-parity/candidate-t27
      - name: Ensure same narrative check sequence, no new regressions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('/tmp/t27-parity')
          a=json.load(open(d/'original-t23/result.json'))
          b=json.load(open(d/'candidate-t27/result.json'))
          assert a['status']==b['status']=='PASS'
          assert a['checks']==b['checks'],(a['checks'],b['checks'])
          assert not a['errors'] and not b['errors']
          print('T27_FRESH_FIRST_ACT_T23_PARITY_PASS',len(a['checks']),a['checks'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t27-uninterrupted-first-act-baseline-comparison
          path: |
            /tmp/t27-parity/
            /tmp/t15-evidence/
            /tmp/t27-parity-http.log
          retention-days: 30
