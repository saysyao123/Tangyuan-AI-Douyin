name: MV Audio Alignment Model Ferry

on:
  workflow_dispatch:
  push:
    branches:
      - test/mv-web-r2
    paths:
      - '.github/workflows/mv-audio-model-ferry.yml'

permissions:
  contents: read

jobs:
  fetch-pinned-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install model downloader
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.27,<1.0'

      - name: Download exact pinned Chinese CTC model
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import snapshot_download

          repo_id = 'jonatasgrosman/wav2vec2-large-xlsr-53-chinese-zh-cn'
          revision = 'd2af85f00e501bb8b8bcedef3b5c51eabb883088'
          out = Path('mv_alignment_model')
          snapshot_download(
              repo_id=repo_id,
              revision=revision,
              local_dir=out,
          )
          print(f'model_dir={out.resolve()}')
          PY

      - name: Write immutable model manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path('mv_alignment_model')
          files = []
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(8 * 1024 * 1024), b''):
                      h.update(chunk)
              files.append({
                  'path': p.relative_to(root).as_posix(),
                  'size': p.stat().st_size,
                  'sha256': h.hexdigest(),
              })
          manifest = {
              'repo_id': 'jonatasgrosman/wav2vec2-large-xlsr-53-chinese-zh-cn',
              'revision': 'd2af85f00e501bb8b8bcedef3b5c51eabb883088',
              'files': files,
          }
          Path('mv_alignment_model_manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(f'files={len(files)} total_bytes={sum(x["size"] for x in files)}')
          PY

      - name: Upload pinned model artifact
        uses: actions/upload-artifact@v4
        with:
          name: mv-w02a-zh-ctc-model-d2af85f
          path: |
            mv_alignment_model/
            mv_alignment_model_manifest.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
