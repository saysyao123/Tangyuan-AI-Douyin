name: T20 first-act street baseline only
on:
  push:
    branches: ['feature/book-rpg-act1-art-master-20261017']
    paths:
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t20-street-camera-e2e.mjs'
      - '.github/workflows/book_rpg_typepal_t20_street_baseline.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  street-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {path: book-rpg, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: IllegalCreed/type-pal, ref: f98d0ddd89ebdee7b04502ee35de26ee82c6d246, path: upstream, persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - run: pnpm install --frozen-lockfile
        working-directory: upstream
      - run: python -m pip install pillow
      - name: Build established T18 public fixture without modifying game
        run: node book-rpg/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t18/build.mjs upstream "$PWD/web"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: upstream
      - name: HTTP for public test only
        run: |
          python3 -m http.server 6154 --bind 127.0.0.1 --directory web >/tmp/t20-server.log 2>&1 &
          for i in {1..25}; do if curl -fsS http://127.0.0.1:6154/chapter/game/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/t20-server.log
          exit 1
      - name: Capture exactly street scene with saved native position
        working-directory: upstream
        run: |
          cp ../book-rpg/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t20-street-camera-e2e.mjs ./
          mkdir -p book-rpg-tests
          cp ../book-rpg/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/fixtures/t15-street.native-save.json book-rpg-tests/
          node t20-street-camera-e2e.mjs
      - name: Save evidence even on failure
        if: always()
        run: |
          mkdir -p /tmp/t20-act1-street
          cp /tmp/t20-server.log /tmp/t20-act1-street/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: t20-first-act-street-baseline, path: /tmp/t20-act1-street/, retention-days: 30}
