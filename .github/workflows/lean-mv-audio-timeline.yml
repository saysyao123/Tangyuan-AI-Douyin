name: Lean MV Audio Timeline Executor

on:
  push:
    branches:
      - test/mv-lean-r1
    paths:
      - '04_HARNESS/tools/mv_audio_timeline/**'
      - '06_TESTS/MV/WEB_R3/30D_60/**/03_AUDIO_TIMELINE/timeline_request.json'
      - '.github/workflows/lean-mv-audio-timeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Faster-Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: mv-faster-whisper-small-v1

      - name: Prepare reusable audio environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check 'faster-whisper==1.2.1'

      - name: Compile reusable Audio Timeline executor
        run: |
          python -m py_compile \
            04_HARNESS/tools/mv_audio_timeline/execute_request.py \
            04_HARNESS/tools/mv_audio_timeline/lightweight_align.py \
            04_HARNESS/tools/mv_audio_timeline/package_tool.py \
            04_HARNESS/tools/mv_audio_timeline/final_gate.py

      - name: Execute pending Audio Timeline requests
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r req; do
            pkg_dir="${req%/timeline_request.json}"
            if [[ -f "$pkg_dir/package_manifest.json" ]]; then
              continue
            fi
            found=1
            echo "Processing $req"
            python 04_HARNESS/tools/mv_audio_timeline/execute_request.py --request "$req"
          done < <(find 06_TESTS/MV/WEB_R3/30D_60 -path '*/03_AUDIO_TIMELINE/timeline_request.json' -type f | sort)
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Persist canonical Audio Timeline evidence
        if: steps.execute.outputs.found == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find 06_TESTS/MV/WEB_R3/30D_60 -path '*/03_AUDIO_TIMELINE/package_manifest.json' -type f -print0 | while IFS= read -r -d '' manifest; do
            git add "$(dirname "$manifest")"
          done
          if git diff --cached --quiet; then
            echo 'No Audio Timeline changes to commit.'
          else
            git commit -m 'lean-r1: persist canonical Audio Timeline package'
            git pull --rebase origin test/mv-lean-r1
            git push
          fi
