name: R3 Public Historical Data Center Build

on:
  push:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/run_public_observed_30d.py'
      - '06_TESTS/MV/WEB_R3/database/build_public_data_center.py'
      - '06_TESTS/MV/WEB_R3/data_center_build_trigger.txt'
      - '.github/workflows/r3-public-data-center-build.yml'
  pull_request:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/run_public_observed_30d.py'
      - '06_TESTS/MV/WEB_R3/database/build_public_data_center.py'
      - '06_TESTS/MV/WEB_R3/data_center_build_trigger.txt'
      - '.github/workflows/r3-public-data-center-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public collector dependency
        run: python -m pip install requests
      - name: Collect current public observed snapshot
        run: python 06_TESTS/MV/WEB_R3/tools/run_public_observed_30d.py
      - name: Build cumulative positive-evidence data center
        run: python 06_TESTS/MV/WEB_R3/database/build_public_data_center.py
      - name: Validate generated data center
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          p=pathlib.Path('06_TESTS/MV/WEB_R3/database/data_center')
          m=json.loads((p/'manifest.json').read_text(encoding='utf-8'))
          works=list(csv.DictReader((p/'observed_works.csv').open(encoding='utf-8-sig')))
          ids=[x['aweme_id'] for x in works]
          assert m['locked_core_accounts']==9, m
          assert len(works)>0, m
          assert len(ids)==len(set(ids)), 'duplicate aweme_id in observed_works.csv'
          assert all(x['work_url'].startswith('http') for x in works), 'invalid work URL'
          assert (p/'song_normalization.csv').exists()
          assert (p/'direct_douyin_evidence.json').exists()
          print(json.dumps(m, ensure_ascii=False, indent=2))
          PY
      - name: Persist canonical data center on R3 branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            06_TESTS/MV/WEB_R3/database/public_observed_30d \
            06_TESTS/MV/WEB_R3/database/data_center
          if git diff --cached --quiet; then
            echo 'No data-center changes to persist.'
          else
            git commit -m 'R3 data center: refresh public observed snapshot'
            git push origin HEAD:test/mv-web-r3
          fi
      - name: Upload data center build
        uses: actions/upload-artifact@v4
        with:
          name: r3-public-data-center
          path: |
            06_TESTS/MV/WEB_R3/database/public_observed_30d
            06_TESTS/MV/WEB_R3/database/data_center
          retention-days: 14
