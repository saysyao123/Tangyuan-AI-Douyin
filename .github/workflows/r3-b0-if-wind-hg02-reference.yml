name: R3 B0 If Wind HG02 Reference

on:
  pull_request:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/b0_extract_if_wind_hg02_reference.py'
      - '06_TESTS/MV/WEB_R3/b0_hg02_reference_trigger.txt'
      - '.github/workflows/r3-b0-if-wind-hg02-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install requests
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Build HG02 audio reference
        run: python 06_TESTS/MV/WEB_R3/tools/b0_extract_if_wind_hg02_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: r3-if-wind-hg02-reference
          path: 06_TESTS/MV/WEB_R3/_hg02_audio_artifact
          retention-days: 7
