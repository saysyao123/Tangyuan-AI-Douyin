name: MV Web Stable P1 Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'mv_web_stable/**'
      - '.github/workflows/mv_web_stable_smoke.yml'

permissions:
  contents: read

concurrency:
  group: mv-web-stable-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: 2-second Skill Canvas MP4 smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned browser renderer
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium --only-shell
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Restore pinned, licensed fonts
        working-directory: 08_AGENT_CONTROL_LAYER/pilots/CODE_MOTION_MV_RUN01_2026-10-06
        run: python bootstrap_fonts.py

      - name: Generate synthetic test audio (no commercial music)
        run: |
          mkdir -p mv_web_stable/out
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'sine=frequency=440:sample_rate=44100:duration=2' -af 'volume=0.08' -ac 2 -c:a pcm_s16le mv_web_stable/out/test_tone_2s.wav

      - name: Render actual Skill Canvas engine 2 seconds
        run: |
          python -u 08_AGENT_CONTROL_LAYER/pilots/CODE_MOTION_MV_RUN01_2026-10-06/engine/render.py \
            --film night \
            --from 0 --to 2 --fps 30 \
            --audio mv_web_stable/out/test_tone_2s.wav \
            --out mv_web_stable/out/mv_2sec_smoke.mp4 --crf 18

      - name: Verify decoded video/audio and export preview
        run: |
          python mv_web_stable/smoke/verify_smoke.py \
            mv_web_stable/out/mv_2sec_smoke.mp4 \
            mv_web_stable/out/smoke_report.json \
            mv_web_stable/out/smoke_preview.png

      - name: Upload proof and playback file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv-web-stable-p1-${{ github.run_id }}
          path: |
            mv_web_stable/out/mv_2sec_smoke.mp4
            mv_web_stable/out/smoke_report.json
            mv_web_stable/out/smoke_preview.png
          if-no-files-found: warn
          retention-days: 14
