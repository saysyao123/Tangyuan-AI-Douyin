name: Fresh Project S1 Analyze V2

on:
  push:
    branches: [main]
    paths:
      - '08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/runs/FRESH_PROJECT_RUN01_2026-09-26/S1_ANALYZE_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp numpy scipy librosa soundfile faster-whisper
      - name: Acquire selected full source
        run: |
          mkdir -p fresh_s1_v2
          yt-dlp --no-playlist --no-cookies -x --audio-format mp3 --audio-quality 0 -o 'fresh_s1_v2/full.%(ext)s' 'https://peachillusion.bandcamp.com/track/-'
      - name: Analyze structure
        run: |
          python - <<'PY'
          import glob,json,numpy as np,librosa,hashlib,os,subprocess
          p=glob.glob('fresh_s1_v2/full*.mp3')[0]
          y,sr=librosa.load(p,sr=22050,mono=True)
          dur=float(len(y)/sr)
          tempo,beats=librosa.beat.beat_track(y=y,sr=sr)
          tempo=float(np.atleast_1d(tempo)[0])
          beat_times=[float(x) for x in librosa.frames_to_time(beats,sr=sr)]
          onset_env=librosa.onset.onset_strength(y=y,sr=sr)
          onset_frames=librosa.onset.onset_detect(onset_envelope=onset_env,sr=sr,backtrack=True)
          onset_times=[float(x) for x in librosa.frames_to_time(onset_frames,sr=sr)]
          rms=librosa.feature.rms(y=y,frame_length=2048,hop_length=512)[0]
          times=librosa.frames_to_time(np.arange(len(rms)),sr=sr,hop_length=512)
          candidates=[]
          for start in np.arange(0,max(0,dur-20),0.5):
              start=float(start); end=start+20.0
              mask=(times>=start)&(times<end)
              avg=float(np.mean(rms[mask])) if mask.any() else 0.0
              ons=int(sum(start<=t<end for t in onset_times))
              candidates.append({'start':round(start,3),'end':round(end,3),'avg_rms':avg,'onsets':ons,'score':float(avg*(1+0.018*ons))})
          candidates=sorted(candidates,key=lambda x:x['score'],reverse=True)[:20]
          probe=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration,bit_rate:stream=codec_name,sample_rate,channels','-of','json',p],text=True))
          out={'status':'PASS','duration':dur,'tempo_bpm':tempo,'top_20s_windows':candidates,'probe':probe,'sha256':hashlib.sha256(open(p,'rb').read()).hexdigest(),'bytes':os.path.getsize(p)}
          open('fresh_s1_v2/audio_analysis.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Whisper lyric timing
        run: |
          python - <<'PY'
          import glob,json
          from faster_whisper import WhisperModel
          p=glob.glob('fresh_s1_v2/full*.mp3')[0]
          model=WhisperModel('small',device='cpu',compute_type='int8')
          segments,info=model.transcribe(p,language='zh',beam_size=5,word_timestamps=True,vad_filter=False)
          out=[]
          for s in segments:
              words=[]
              for w in (s.words or []):
                  words.append({'start':float(w.start),'end':float(w.end),'word':w.word})
              out.append({'start':float(s.start),'end':float(s.end),'text':s.text.strip(),'words':words})
          open('fresh_s1_v2/whisper_segments.json','w',encoding='utf-8').write(json.dumps({'language':info.language,'duration':info.duration,'segments':out},ensure_ascii=False,indent=2))
          PY
      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-project-s1-analysis-v2
          path: fresh_s1_v2/
          retention-days: 7
      - name: Publish reports
        if: always()
        run: |
          DEST='08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/runs/FRESH_PROJECT_RUN01_2026-09-26/s1_runtime_v2'
          mkdir -p "$DEST"
          cp fresh_s1_v2/audio_analysis.json "$DEST/audio_analysis.json" || true
          cp fresh_s1_v2/whisper_segments.json "$DEST/whisper_segments.json" || true
          git config user.name 'tangyuan-fresh-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then echo no-change; else git commit -m 'fresh-run: publish S1 analysis v2'; git push; fi