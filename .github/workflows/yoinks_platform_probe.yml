name: Yoinks platform probe - isolated smoke test
on:
  push:
    branches:
      - experiment/yoinks-platform-probe-20261027
    paths:
      - .github/workflows/yoinks_platform_probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout branch only
        uses: actions/checkout@v4
      - name: Install latest yt-dlp
        run: |
          python3 -m pip install --user --upgrade yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/yt-dlp" --version
      - name: Verify FFmpeg
        run: ffmpeg -version | head -1
      - name: Probe Douyin, Bilibili, YouTube, Hongguo
        run: python3 09_VIDEO_ACQUISITION_EXPERIMENTS/yoinks_platform_probe.py
      - name: Upload JSON test evidence only (no videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoinks-platform-probe-20261027
          path: yoinks_probe/results.json
          if-no-files-found: warn
          retention-days: 7
