name: R3 Authenticated Data Layer Static Tests

on:
  push:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/data_layer/**'
      - '06_TESTS/MV/WEB_R3/tools/setup_douyin_cookie.py'
      - '06_TESTS/MV/WEB_R3/tools/collect_core_accounts_f2_auth.py'
      - '06_TESTS/MV/WEB_R3/database/**'
      - '06_TESTS/MV/WEB_R3/run_douyin_refresh.ps1'
      - '.gitignore'
      - '.github/workflows/r3-auth-data-layer-static-tests.yml'
  pull_request:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/data_layer/**'
      - '06_TESTS/MV/WEB_R3/tools/setup_douyin_cookie.py'
      - '06_TESTS/MV/WEB_R3/tools/collect_core_accounts_f2_auth.py'
      - '06_TESTS/MV/WEB_R3/database/**'
      - '06_TESTS/MV/WEB_R3/run_douyin_refresh.ps1'
      - '06_TESTS/MV/WEB_R3/auth_static_test_trigger.txt'
      - '.gitignore'
      - '.github/workflows/r3-auth-data-layer-static-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: |
          python -m py_compile \
            06_TESTS/MV/WEB_R3/tools/setup_douyin_cookie.py \
            06_TESTS/MV/WEB_R3/tools/collect_core_accounts_f2_auth.py \
            06_TESTS/MV/WEB_R3/database/normalize_songs.py \
            06_TESTS/MV/WEB_R3/database/build_sqlite.py \
            06_TESTS/MV/WEB_R3/database/analyze_song_repeats.py
      - name: Existing CSV -> corrected SQLite schema
        run: |
          python 06_TESTS/MV/WEB_R3/database/build_sqlite.py \
            --data-dir 06_TESTS/MV/WEB_R3/database \
            --out "$RUNNER_TEMP/r3_static.sqlite3"
      - name: Secrets are not tracked
        shell: bash
        run: |
          if git ls-files | grep -E '06_TESTS/MV/WEB_R3/(\.secrets|\.local_raw)/'; then
            echo 'Local R3 secret/raw file is tracked.' >&2
            exit 1
          fi
          git check-ignore -q 06_TESTS/MV/WEB_R3/.secrets/douyin_cookie.txt
          git check-ignore -q 06_TESTS/MV/WEB_R3/.local_raw/example.json
