name: R3 Douyin Database Bootstrap

on:
  pull_request:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/database/**'
      - '06_TESTS/MV/WEB_R3/core_profile_resolution_v1.json'
      - '06_TESTS/MV/WEB_R3/database_bootstrap_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependency
        run: python -m pip install requests

      - name: Bootstrap nine-account database
        run: python 06_TESTS/MV/WEB_R3/database/bootstrap_database.py

      - name: Build and validate SQLite
        run: |
          cd 06_TESTS/MV/WEB_R3/database
          python build_sqlite.py --out "$RUNNER_TEMP/r3_douyin.sqlite3"

      - name: Commit canonical CSV database back to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            06_TESTS/MV/WEB_R3/database/accounts.csv \
            06_TESTS/MV/WEB_R3/database/works.csv \
            06_TESTS/MV/WEB_R3/database/work_metrics.csv \
            06_TESTS/MV/WEB_R3/database/ingestion_runs.csv \
            06_TESTS/MV/WEB_R3/database/song_normalization.csv \
            06_TESTS/MV/WEB_R3/database/manifest.json
          if git diff --cached --quiet; then
            echo 'No database changes to commit.'
          else
            git commit -m 'R3: bootstrap nine-account Douyin database'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload SQLite analysis artifact
        uses: actions/upload-artifact@v4
        with:
          name: r3-douyin-database
          path: ${{ runner.temp }}/r3_douyin.sqlite3
          retention-days: 7
