name: S1A Deezer Preview Acquisition

on:
  push:
    branches: [main]
    paths:
      - '08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/stages/01_PROJECT_AUDIO/s1a_acquisition/DEEZER_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Run Deezer preview adapter
        env:
          S1A_OUT: deezer_out
        run: |
          python 08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/stages/01_PROJECT_AUDIO/s1a_acquisition/deezer_preview.py
      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1a-deezer-acquisition-result
          path: deezer_out/
          if-no-files-found: error
          retention-days: 7
      - name: Publish structured result
        if: always()
        run: |
          set -e
          RESULT_DIR="08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/stages/01_PROJECT_AUDIO/s1a_acquisition/results/deezer"
          mkdir -p "$RESULT_DIR"
          cp deezer_out/acquisition_report.json "$RESULT_DIR/acquisition_report.json" || true
          cp deezer_out/candidates.json "$RESULT_DIR/candidates.json" || true
          git config user.name "tangyuan-s1a-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$RESULT_DIR"
          if git diff --cached --quiet; then
            echo "No result change."
          else
            git commit -m "s1a: publish Deezer acquisition result"
            git push
          fi
