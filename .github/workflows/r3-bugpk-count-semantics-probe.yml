name: R3 BugPk Count Semantics Probe

on:
  push:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/run_bugpk_count_semantics_probe.py'
      - '.github/workflows/r3-bugpk-count-semantics-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - run: python 06_TESTS/MV/WEB_R3/tools/run_bugpk_count_semantics_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-bugpk-count-semantics
          path: 06_TESTS/MV/WEB_R3/_count_semantics_probe
          retention-days: 7
