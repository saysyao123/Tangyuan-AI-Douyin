name: R3 Public Observed 30D Snapshot

on:
  push:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/run_public_observed_30d.py'
      - '.github/workflows/r3-public-observed-30d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Collect public observed 30-day sample
        run: python 06_TESTS/MV/WEB_R3/tools/run_public_observed_30d.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-public-observed-30d
          path: 06_TESTS/MV/WEB_R3/database/public_observed_30d
          retention-days: 7
