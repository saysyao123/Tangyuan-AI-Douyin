name: R3 B0 If Wind Audio Probe

on:
  push:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/b0_probe_if_wind_audio.py'
      - '.github/workflows/r3-b0-if-wind-audio-probe.yml'
  pull_request:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/b0_probe_if_wind_audio.py'
      - '06_TESTS/MV/WEB_R3/b0_audio_probe_trigger.txt'
      - '.github/workflows/r3-b0-if-wind-audio-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install requests
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools

      - name: Probe three core Douyin works
        run: python 06_TESTS/MV/WEB_R3/tools/b0_probe_if_wind_audio.py

      - name: Persist probe report on canonical branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 06_TESTS/MV/WEB_R3/B0_IF_WIND_AUDIO_PROBE/audio_probe_report.json
          if git diff --cached --quiet; then
            echo "No probe report changes."
          else
            git commit -m "R3 B0: persist 如果风会替我说话 audio fingerprint report"
            git push origin HEAD:test/mv-web-r3
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-b0-if-wind-audio-probe
          path: 06_TESTS/MV/WEB_R3/B0_IF_WIND_AUDIO_PROBE/audio_probe_report.json
          if-no-files-found: warn
          retention-days: 7
