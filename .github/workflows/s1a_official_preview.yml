name: S1A Official Preview Acquisition

on:
  push:
    branches: [main]
    paths:
      - '08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/stages/01_PROJECT_AUDIO/s1a_acquisition/TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ffprobe
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
      - name: Run Apple iTunes preview adapter
        env:
          S1A_OUT: s1a_out
        run: |
          python 08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/stages/01_PROJECT_AUDIO/s1a_acquisition/apple_itunes_preview.py
      - name: Upload acquisition artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1a-acquisition-result
          path: s1a_out/
          if-no-files-found: error
          retention-days: 7
