name: R3 Core Account 15D Probe

on:
  push:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/core_profile_links_input.json'
      - '06_TESTS/MV/WEB_R3/tools/run_core_15d_probe.py'
      - '06_TESTS/MV/WEB_R3/tools/run_core_15d_browser_probe.py'
      - '.github/workflows/r3-core-account-15d-probe.yml'
  pull_request:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/core_profile_links_input.json'
      - '06_TESTS/MV/WEB_R3/tools/run_core_15d_probe.py'
      - '06_TESTS/MV/WEB_R3/tools/run_core_15d_browser_probe.py'
      - '06_TESTS/MV/WEB_R3/probe_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout probe ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare public Douyin metadata backend
        shell: bash
        run: |
          git clone --depth 1 https://github.com/jiji262/douyin-downloader.git .tmp_douyin_downloader
          python -m pip install --upgrade pip
          python -m pip install -r .tmp_douyin_downloader/requirements.txt

      - name: API-path diagnostic probe
        shell: bash
        run: |
          python 06_TESTS/MV/WEB_R3/tools/run_core_15d_probe.py

      - name: Prepare browser fallback
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser-backed core profile probe
        shell: bash
        run: |
          python 06_TESTS/MV/WEB_R3/tools/run_core_15d_browser_probe.py

      - name: Upload R3 probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-core-account-15d-probe
          path: |
            06_TESTS/MV/WEB_R3/_probe_output
            06_TESTS/MV/WEB_R3/_browser_probe_output
          if-no-files-found: warn
          retention-days: 7
