name: Fresh Project S1 Structure Segmentation

on:
  push:
    branches: [main]
    paths:
      - '08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/runs/FRESH_PROJECT_RUN01_2026-09-26/S1_STRUCTURE_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp numpy scipy librosa soundfile scikit-learn
      - name: Acquire
        run: |
          mkdir -p structure_out
          yt-dlp --no-playlist --no-cookies -x --audio-format mp3 --audio-quality 0 -o 'structure_out/full.%(ext)s' 'https://peachillusion.bandcamp.com/track/-'
      - name: Segment structure
        run: |
          python - <<'PY'
          import glob,json,numpy as np,librosa
          from sklearn.metrics.pairwise import cosine_similarity
          p=glob.glob('structure_out/full*.mp3')[0]
          y,sr=librosa.load(p,sr=22050,mono=True)
          dur=float(len(y)/sr)
          tempo,beats=librosa.beat.beat_track(y=y,sr=sr,trim=False)
          beats=np.asarray(beats,dtype=int)
          if len(beats)<10:
              beats=np.arange(0,len(y)//512,16,dtype=int)
          chroma=librosa.feature.chroma_cqt(y=y,sr=sr)
          chroma_sync=librosa.util.sync(chroma,beats,aggregate=np.median)
          rms=librosa.feature.rms(y=y,hop_length=512)[0]
          onset_env=librosa.onset.onset_strength(y=y,sr=sr)
          onset_frames=librosa.onset.onset_detect(onset_envelope=onset_env,sr=sr)
          onset_times=librosa.frames_to_time(onset_frames,sr=sr)
          results={}
          for k in [6,8,10,12]:
              if chroma_sync.shape[1] <= k: continue
              bounds=librosa.segment.agglomerative(chroma_sync,k=k)
              bounds=np.unique(np.concatenate(([0],bounds,[chroma_sync.shape[1]-1]))).astype(int)
              # map beat-sync index to original beat frame/time
              times=[]
              for b in bounds:
                  bi=min(int(b),len(beats)-1)
                  times.append(float(librosa.frames_to_time(beats[bi],sr=sr)))
              times[0]=0.0; times[-1]=dur
              segs=[]; feats=[]
              for i in range(len(times)-1):
                  s,e=times[i],times[i+1]
                  fs=max(0,min(int(bounds[i]),chroma_sync.shape[1]-1))
                  fe=max(fs+1,min(int(bounds[i+1]),chroma_sync.shape[1]))
                  v=np.mean(chroma_sync[:,fs:fe],axis=1)
                  feats.append(v)
                  f0=int(s*sr/512); f1=min(len(rms),int(e*sr/512)+1)
                  avg=float(np.mean(rms[f0:f1])) if f1>f0 else 0.0
                  ons=int(np.sum((onset_times>=s)&(onset_times<e)))
                  segs.append({'id':i,'start':round(s,3),'end':round(e,3),'duration':round(e-s,3),'avg_rms':avg,'onsets':ons})
              sim=cosine_similarity(np.stack(feats)).tolist() if len(feats)>1 else [[1.0]]
              pairs=[]
              for i in range(len(segs)):
                  for j in range(i+1,len(segs)):
                      if segs[i]['duration']>=8 and segs[j]['duration']>=8:
                          pairs.append({'a':i,'b':j,'similarity':float(sim[i][j]),'dur_a':segs[i]['duration'],'dur_b':segs[j]['duration']})
              pairs=sorted(pairs,key=lambda x:x['similarity'],reverse=True)[:12]
              results[str(k)]={'segments':segs,'top_repeat_pairs':pairs}
          out={'status':'PASS','duration':dur,'tempo_bpm':float(np.atleast_1d(tempo)[0]),'segmentations':results}
          open('structure_out/structure.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Publish
        if: always()
        run: |
          DEST='08_AGENT_CONTROL_LAYER/runtime/MV_RUNTIME_V0_1/runs/FRESH_PROJECT_RUN01_2026-09-26/s1_structure'
          mkdir -p "$DEST"
          cp structure_out/structure.json "$DEST/structure.json" || true
          git config user.name 'tangyuan-fresh-run-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then echo no-change; else git commit -m 'fresh-run: publish structural segmentation'; git push; fi