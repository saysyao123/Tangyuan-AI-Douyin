name: T29 actual visible HD architecture in existing first-act game
on:
  push:
    branches: ['feature/t29-visible-hd-architecture-20261018']
    paths:
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t29/**'
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/art/t29/**'
      - '09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t29-art-overlay-e2e.mjs'
      - '.github/workflows/book_rpg_t29_hd_architecture.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  native-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {path: source, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: saysyao123/Tangyuan-AI-Douyin
          ref: t27-act1-playtest
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: IllegalCreed/type-pal
          ref: f98d0ddd89ebdee7b04502ee35de26ee82c6d246
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with: {version: 10.17.1, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0'}
      - run: pnpm install --frozen-lockfile
        working-directory: upstream
      - run: python3 -m pip install pillow
      - name: Add independent image-driven buildings to original T27 page
        run: |
          cp source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/art/t29/hd-house.png candidate/chapter/game/hd-house.png
          cp source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t29/hd-architecture.js candidate/chapter/game/t29-hd-architecture.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('candidate/chapter/game/index.html')
          s=p.read_text()
          assert s.count('</body>')==1
          s=s.replace('</body>', '<script defer src="./t29-hd-architecture.js"></script>\n</body>')
          p.write_text(s)
          from PIL import Image
          im=Image.open('candidate/chapter/game/hd-house.png')
          im.verify()
          print('T29_REAL_ORIGINAL_HD_IMAGE_ASSET_IN_WEB_GAME_PASS')
          PY
          cmp source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tools/t29/hd-architecture.js candidate/chapter/game/t29-hd-architecture.js
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: upstream
      - name: Local server
        run: |
          python3 -m http.server 6154 --bind 127.0.0.1 --directory . >/tmp/t29-http.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:6154/candidate/chapter/game/ >/dev/null; then exit 0; fi; sleep 1; done
          exit 1
      - name: Real game photo-layer integration screenshots and click-through
        working-directory: upstream
        run: |
          cp ../source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/t29-art-overlay-e2e.mjs ./
          mkdir -p book-rpg-tests
          cp ../source/09_GAME_ADAPTATION/BOOK_TO_RPG_PIPELINE_V1/tests/fixtures/t15-street.native-save.json book-rpg-tests/
          node t29-art-overlay-e2e.mjs
      - name: Demand material pixel differences between original and detailed art
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageChops
          import json
          d={}
          for scene in ['street','courtyard']:
           a=Image.open('/tmp/t29-evidence/'+scene+'-HD-ON.png').convert('RGB')
           b=Image.open('/tmp/t29-evidence/'+scene+'-HD-OFF.png').convert('RGB')
           assert a.size==b.size
           diff=ImageChops.difference(a,b).convert('L')
           hist=diff.histogram()
           frac=sum(hist[12:])/sum(hist)
           d[scene]=round(frac,4)
           assert frac>.025,(scene,frac)
          open('/tmp/t29-evidence/PIXEL_DIFF.json','w').write(json.dumps(d,indent=2))
          print('T29_VISIBLE_NEW_ART_PIXELS_PASS',d)
          PY
      - name: ZIP complete preview (not finished-art edition)
        if: always()
        run: |
          if test -d candidate/chapter; then cd candidate && zip -qr /tmp/t29-evidence/T29_FIRST_ACT_HD_HOUSES_PLAYABLE.zip .; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t29-real-hd-house-playable-qa
          path: /tmp/t29-evidence/
          retention-days: 30
      - name: Publish independently only when native screenshot test passes
        if: success()
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd candidate
          git init -q
          git config user.name "T29 First Act Art CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -qb t29-hd-buildings-playtest
          git add -A
          git commit -qm "T29 original native first act with detailed architecture overlay"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/t29-hd-buildings-playtest --force
