name: R3 MV Runtime D02-A Closure Import

on:
  push:
    branches:
      - refactor/mv-runtime-consolidation-v2
    paths:
      - '.github/workflows/r3-mv-runtime-d02a-close-import.yml'

permissions:
  contents: write

concurrency:
  group: mv-runtime-d02a-close-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-d02a-to-canonical-s04:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest branch truth
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin "$GITHUB_REF_NAME"

      - name: Plan, import and verify D02-A only through S04
        shell: bash
        run: |
          set -euo pipefail
          SLOT='06_TESTS/MV/WEB_R3/30D_60/D02-A'
          SRC=(
            --source LEGACY_STATE=CURRENT_STATE.json
            --source HG01_CANDIDATE_EVIDENCE=HG01_CANDIDATE_EVIDENCE_PACK_v1.md
            --source HG01_SELECTION_RECEIPT=HG01_SELECTION_RECEIPT_v1.md
            --source HG02_LISTENING_PACK=HG02_LISTENING_PACK_v1.md
            --source HG02_LOCK_RECEIPT=HG02_BGM_LOCK_RECEIPT_v1.md
            --source AUDIO_TIMELINE_DIR=AUDIO_TIMELINE_PACKAGE
            --source NATURAL_BEAT=NATURAL_BEAT_v1.md
          )

          if test -f "$SLOT/00_STATE/CURRENT_STATE.json"; then
            python 04_HARNESS/tools/mv_runtime_legacy_import.py verify --slot-root "$SLOT" > /tmp/d02a-verify.json
          else
            python 04_HARNESS/tools/mv_runtime_legacy_import.py plan --slot-root "$SLOT" "${SRC[@]}" > /tmp/d02a-plan.json
            PLAN_SHA="$(python - <<'PY'
          import json
          p=json.load(open('/tmp/d02a-plan.json',encoding='utf-8'))
          assert p['ok'] is True
          assert p['plan']['target_stage']=='S04_NATURAL_BEAT_LOCKED'
          assert p['plan']['downstream_not_proven_from_stage']=='S05_DIRECTOR_PLAN_LOCKED'
          print(p['plan_sha256'])
          PY
          )"
            python 04_HARNESS/tools/mv_runtime_legacy_import.py import \
              --slot-root "$SLOT" "${SRC[@]}" \
              --plan-sha256 "$PLAN_SHA" \
              --selected-by runtime_consolidation_close \
              --reason 'Controlled production import of D02-A legacy durable evidence. Import boundary is S04 only; S05+ remains unproven.' \
              > /tmp/d02a-import.json
            python 04_HARNESS/tools/mv_runtime_legacy_import.py verify --slot-root "$SLOT" > /tmp/d02a-verify.json
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          slot=Path('06_TESTS/MV/WEB_R3/30D_60/D02-A')
          ver=json.load(open('/tmp/d02a-verify.json',encoding='utf-8'))
          assert ver['ok'] is True
          assert ver['canonical_state']['current_stage']=='S04_NATURAL_BEAT_LOCKED'
          receipt=json.load(open(slot/'00_STATE/LEGACY_IMPORT_RECEIPT.json',encoding='utf-8'))
          assert receipt['status']=='PASS'
          assert receipt['imported_through_stage']=='S04_NATURAL_BEAT_LOCKED'
          assert receipt['downstream_not_proven_from_stage']=='S05_DIRECTOR_PLAN_LOCKED'
          assert receipt['safety_assertions']['S05_and_later_imported'] is False
          assert receipt['safety_assertions']['S17_published_inferred'] is False
          assert not (slot/'05_DIRECTOR/DIRECTOR_PLAN.md').exists()
          print(json.dumps(ver,ensure_ascii=False,indent=2))
          PY

      - name: Commit only canonical D02-A import outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            06_TESTS/MV/WEB_R3/30D_60/D02-A/00_STATE \
            06_TESTS/MV/WEB_R3/30D_60/D02-A/01_SONG \
            06_TESTS/MV/WEB_R3/30D_60/D02-A/02_BGM \
            06_TESTS/MV/WEB_R3/30D_60/D02-A/03_AUDIO_TIMELINE \
            06_TESTS/MV/WEB_R3/30D_60/D02-A/04_BEATS

          if git diff --cached --quiet; then
            echo 'No new canonical import outputs; existing import already verified.'
            exit 0
          fi

          if git diff --cached --name-only | grep -Ev '^06_TESTS/MV/WEB_R3/30D_60/D02-A/(00_STATE|01_SONG|02_BGM|03_AUDIO_TIMELINE|04_BEATS)/' >/tmp/d02a-unexpected.txt; then
            echo 'ERROR: unexpected staged path(s):'
            cat /tmp/d02a-unexpected.txt
            exit 1
          fi

          git commit -m 'runtime: import D02-A legacy evidence to canonical S04'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
