name: Linux independent downloader verdict - no apt
on:
  push:
    branches:
      - experiment/yoinks-platform-probe-20261027
    paths:
      - .github/workflows/final_linux_quick.yml
      - 09_VIDEO_ACQUISITION_EXPERIMENTS/final_linux_quick.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install yt-dlp EJS and pip-bundled FFmpeg
        run: |
          python -m pip install --upgrade "yt-dlp[default]" imageio-ffmpeg
          mkdir -p "$HOME/bin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$HOME/bin/ffmpeg"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Real media download and decode checks
        run: python 09_VIDEO_ACQUISITION_EXPERIMENTS/final_linux_quick.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-linux-quick-json
          path: linux_quick_results/results.json
          retention-days: 7
          if-no-files-found: warn
