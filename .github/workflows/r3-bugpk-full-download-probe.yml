name: R3 BugPk Full Download Probe

on:
  pull_request:
    branches:
      - test/mv-web-r3
    paths:
      - '06_TESTS/MV/WEB_R3/tools/run_bugpk_full_download_probe.py'
      - '06_TESTS/MV/WEB_R3/bugpk_full_probe_trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare dependencies
        run: |
          python -m pip install requests
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Download complete MP4 samples and ffprobe
        run: python 06_TESTS/MV/WEB_R3/tools/run_bugpk_full_download_probe.py
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r3-bugpk-full-download-probe
          path: 06_TESTS/MV/WEB_R3/_bugpk_full_download_probe/full_download_probe.json
          if-no-files-found: warn
          retention-days: 7
