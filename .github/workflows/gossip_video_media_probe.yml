name: Gossip Video Media Access Probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gossip_video_media_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check accessible licensed media files (no bulk download)
        run: |
          python - <<'PY'
          import urllib.request, urllib.error
          samples = {
            "pexels_museum_vertical": "https://videos.pexels.com/video-files/35818187/15186896_1080_1920_30fps.mp4",
            "pexels_phone_horizontal": "https://videos.pexels.com/video-files/3252145/3252145-uhd_3840_2160_25fps.mp4",
            "wikimedia_phone": "https://upload.wikimedia.org/wikipedia/commons/c/cb/GSMA_MISTT_Smartphone_(Android)_Educational_Video.webm"
          }
          results={}
          for name,url in samples.items():
              try:
                  request=urllib.request.Request(url,headers={'Range':'bytes=0-1023','User-Agent':'GossipVideoWorkflow/1.1 (https://github.com/saysyao123/Tangyuan-AI-Douyin)'})
                  with urllib.request.urlopen(request,timeout=20) as response:
                      chunk=response.read(1024)
                      results[name]={'http':response.status,'type':response.headers.get('Content-Type'),'bytes_read':len(chunk)}
              except Exception as exc:
                  results[name]={'error':type(exc).__name__,'detail':str(exc)[:150]}
              print(name,results[name],flush=True)
          if not any(v.get('http') in (200,206) and v.get('bytes_read') for k,v in results.items() if k.startswith('pexels')):
              raise SystemExit('No accessible licensed fallback video')
          PY