name: MV lyric timing probe

on:
  push:
    branches: [test/mv-web-r2]
    paths:
      - '.github/workflows/mv-lyric-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe same-version timed lyrics
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request, base64, re

          title='如果你也刚好抬头看树'
          artist='孙天宇'
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'

          def get(url, headers=None):
              h={'User-Agent':ua}
              if headers: h.update(headers)
              req=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read().decode('utf-8','replace')

          out={'title':title,'artist':artist,'netease':{},'qq':{}}

          # NetEase old web API search + lyric endpoint
          try:
              q=urllib.parse.quote(title)
              url=f'https://music.163.com/api/search/get/web?csrf_token=&s={q}&type=1&offset=0&total=true&limit=20'
              raw=get(url,{'Referer':'https://music.163.com/'})
              data=json.loads(raw)
              songs=((data.get('result') or {}).get('songs') or [])
              out['netease']['search']=[{'id':s.get('id'),'name':s.get('name'),'artists':[a.get('name') for a in s.get('artists',[])],'album':(s.get('album') or {}).get('name'),'duration_ms':s.get('duration')} for s in songs]
              chosen=None
              for s in songs:
                  arts=' / '.join(a.get('name','') for a in s.get('artists',[]))
                  if s.get('name')==title and artist in arts:
                      chosen=s; break
              if not chosen and songs: chosen=songs[0]
              if chosen:
                  sid=chosen['id']
                  lraw=get(f'https://music.163.com/api/song/lyric?id={sid}&lv=1&kv=1&tv=-1',{'Referer':'https://music.163.com/'})
                  lj=json.loads(lraw)
                  out['netease']['chosen_id']=sid
                  out['netease']['lrc']=(lj.get('lrc') or {}).get('lyric')
                  out['netease']['tlyric']=(lj.get('tlyric') or {}).get('lyric')
          except Exception as e:
              out['netease']['error']=repr(e)

          # QQ Music search + lyric endpoint
          try:
              params=urllib.parse.urlencode({'ct':24,'qqmusic_ver':1298,'new_json':1,'remoteplace':'txt.yqq.center','searchid':'','t':0,'aggr':1,'cr':1,'catZhida':1,'lossless':0,'flag_qc':0,'p':1,'n':20,'w':title,'g_tk':5381,'loginUin':0,'hostUin':0,'format':'json','inCharset':'utf8','outCharset':'utf-8','notice':0,'platform':'yqq.json','needNewCode':0})
              raw=get('https://c.y.qq.com/soso/fcgi-bin/client_search_cp?'+params,{'Referer':'https://y.qq.com/'})
              data=json.loads(raw)
              songs=((((data.get('data') or {}).get('song') or {}).get('list')) or [])
              compact=[]
              for s in songs:
                  singers=[x.get('name') for x in (s.get('singer') or [])]
                  compact.append({'songmid':s.get('songmid'),'songid':s.get('songid'),'name':s.get('songname') or s.get('name'),'singers':singers,'album':s.get('albumname'),'interval':s.get('interval')})
              out['qq']['search']=compact
              chosen=None
              for s in songs:
                  name=s.get('songname') or s.get('name')
                  singers=' / '.join(x.get('name','') for x in (s.get('singer') or []))
                  if name==title and artist in singers:
                      chosen=s; break
              if not chosen and songs: chosen=songs[0]
              if chosen:
                  mid=chosen.get('songmid')
                  lp=urllib.parse.urlencode({'songmid':mid,'format':'json','nobase64':1,'g_tk':5381,'loginUin':0,'hostUin':0,'inCharset':'utf8','outCharset':'utf-8','notice':0,'platform':'yqq.json','needNewCode':0})
                  lraw=get('https://c.y.qq.com/lyric/fcgi-bin/fcg_query_lyric_new.fcg?'+lp,{'Referer':'https://y.qq.com/portal/player.html'})
                  lj=json.loads(lraw)
                  lyric=lj.get('lyric')
                  if lyric and not '[' in lyric:
                      try: lyric=base64.b64decode(lyric).decode('utf-8','replace')
                      except Exception: pass
                  out['qq']['chosen_mid']=mid
                  out['qq']['lyric']=lyric
          except Exception as e:
              out['qq']['error']=repr(e)

          print('===MV_LYRIC_PROBE_JSON_BEGIN===')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          print('===MV_LYRIC_PROBE_JSON_END===')
          with open('/tmp/mv_lyric_probe.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mv-lyric-probe
          path: /tmp/mv_lyric_probe.json
          retention-days: 1
