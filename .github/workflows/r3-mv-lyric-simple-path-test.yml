name: R3 MV Lyric Simple Path Test

on:
  push:
    branches:
      - test/mv-oss-optimization-r1
    paths:
      - '06_TESTS/MV/OSS_OPT_R1/requests/LYRIC_LIGHTWEIGHT_TEST_*.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: r3-mv-lyric-simple-path-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transcript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore lightweight Faster-Whisper cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            .cache/huggingface
          key: mv-lyric-fw-small-${{ runner.os }}-py311-v1

      - name: Install only lightweight lyric dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q faster-whisper==1.2.1

      - name: Resolve immutable test request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t REQS < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^06_TESTS/MV/OSS_OPT_R1/requests/LYRIC_LIGHTWEIGHT_TEST_.*\.json$' || true)
          if [ "${#REQS[@]}" -ne 1 ]; then
            echo "Expected exactly one lightweight lyric request, got ${#REQS[@]}" >&2
            exit 2
          fi
          cp "${REQS[0]}" /tmp/request.json

      - name: Download exact HG02 audio and verify SHA
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(python -c "import json;print(json.load(open('/tmp/request.json'))['audio_workflow_run_id'])")"
          ARTIFACT="$(python -c "import json;print(json.load(open('/tmp/request.json'))['audio_artifact_name'])")"
          FILE="$(python -c "import json;print(json.load(open('/tmp/request.json'))['audio_file_name'])")"
          EXPECTED="$(python -c "import json;print(json.load(open('/tmp/request.json'))['audio_sha256'])")"
          rm -rf /tmp/audio && mkdir -p /tmp/audio
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir /tmp/audio
          AUDIO="/tmp/audio/$FILE"
          test -f "$AUDIO"
          GOT="$(sha256sum "$AUDIO" | awk '{print $1}')"
          test "$GOT" = "$EXPECTED"
          echo "AUDIO=$AUDIO" >> "$GITHUB_ENV"
          echo "audio_sha256=$GOT"

      - name: One-pass Faster-Whisper transcript plus trusted-text mapping
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fw && mkdir -p /tmp/fw
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          import difflib, json, os, re, time

          req=json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))
          trusted=req.get('trusted_lyrics') or []
          audio=os.environ['AUDIO']

          def norm(s):
              return ''.join(re.findall(r'[\u4e00-\u9fff]', s or ''))

          t0=time.monotonic()
          model=WhisperModel('small', device='cpu', compute_type='int8')
          t1=time.monotonic()
          segments_gen, info=model.transcribe(
              audio,
              language='zh',
              beam_size=5,
              temperature=0.0,
              word_timestamps=True,
              vad_filter=False,
              condition_on_previous_text=False,
              initial_prompt='，'.join(trusted) if trusted else None,
              suppress_blank=False,
          )
          segments=list(segments_gen)
          t2=time.monotonic()

          out_segments=[]
          chars=[]
          recognized=[]
          for seg in segments:
              words=[]
              for w in seg.words or []:
                  token=norm(w.word)
                  if not token:
                      continue
                  start=float(w.start if w.start is not None else seg.start)
                  end=float(w.end if w.end is not None else seg.end)
                  span=max(end-start,0.001)
                  for i,ch in enumerate(token):
                      chars.append({'char':ch,'start':round(start+span*i/len(token),4),'end':round(start+span*(i+1)/len(token),4)})
                      recognized.append(ch)
                  words.append({'token':token,'start':round(start,4),'end':round(end,4)})
              out_segments.append({'start':round(float(seg.start),4),'end':round(float(seg.end),4),'text':(seg.text or '').strip(),'normalized':norm(seg.text),'words':words})

          recognized_text=''.join(recognized)
          target=''.join(norm(x) for x in trusted)
          mapping={}
          if target:
              sm=difflib.SequenceMatcher(a=target,b=recognized_text,autojunk=False)
              for tag,i1,i2,j1,j2 in sm.get_opcodes():
                  if tag=='equal':
                      for k in range(i2-i1):
                          mapping[i1+k]=j1+k
          else:
              sm=None

          line_results=[]
          cursor=0
          for idx,line in enumerate(trusted,1):
              n=norm(line)
              idxs=[mapping[i] for i in range(cursor,cursor+len(n)) if i in mapping]
              line_results.append({
                  'line_no':idx,
                  'text':line,
                  'char_count':len(n),
                  'matched_chars':len(idxs),
                  'coverage':round(len(idxs)/len(n),4) if n else 0.0,
                  'start':round(min((chars[j]['start'] for j in idxs),default=0.0),4) if idxs else None,
                  'end':round(max((chars[j]['end'] for j in idxs),default=0.0),4) if idxs else None,
              })
              cursor+=len(n)

          starts=[x['start'] for x in line_results]
          monotonic=bool(line_results) and all(starts[i] is not None and starts[i+1] is not None and starts[i] < starts[i+1] for i in range(len(starts)-1))
          full_coverage=bool(line_results) and all(x['coverage']==1.0 for x in line_results)
          decision='LIGHTWEIGHT_ALIGNMENT_PASS' if full_coverage and monotonic else 'LIGHTWEIGHT_ALIGNMENT_REVIEW_REQUIRED'

          report={
              'schema_version':'1.1',
              'test':'D01B_LIGHTWEIGHT_FASTER_WHISPER_TRUSTED_TEXT_MAPPING',
              'slot_id':req['slot_id'],
              'song_family':req['song_family'],
              'audio_sha256':req['audio_sha256'],
              'tool':{'name':'faster-whisper','version':'1.2.1','model':'small','device':'cpu','compute_type':'int8'},
              'language':info.language,
              'language_probability':info.language_probability,
              'model_init_seconds':round(t1-t0,3),
              'transcribe_seconds':round(t2-t1,3),
              'total_model_seconds':round(t2-t0,3),
              'segment_count':len(out_segments),
              'recognized_text':' '.join(s['text'] for s in out_segments if s['text']),
              'recognized_normalized':recognized_text,
              'recognized_char_count':len(chars),
              'sequence_ratio':round(sm.ratio(),4) if sm else None,
              'line_results':line_results,
              'all_lines_full_coverage':full_coverage,
              'line_starts_monotonic':monotonic,
              'segments':out_segments,
              'character_timestamps':chars,
              'decision':decision
          }
          Path('/tmp/fw/lightweight_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: D02B-lyric-lightweight-test-${{ github.run_id }}
          path: /tmp/fw/lightweight_report.json
          retention-days: 3
          if-no-files-found: error
